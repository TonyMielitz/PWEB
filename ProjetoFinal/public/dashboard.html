<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contabilidade Ágil - Painel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Contabilidade Ágil</div>
    <div class="user">
      <span id="user-name"></span>
      <button type="button" id="btn-logout">Sair</button>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <div class="label">Receitas</div>
        <div class="value receita" id="total-receitas">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Despesas</div>
        <div class="value despesa" id="total-despesas">R$ 0,00</div>
      </div>
      <div class="card">
        <div class="label">Saldo</div>
        <div class="value" id="total-saldo">R$ 0,00</div>
      </div>
    </section>

    <section class="panel">
      <h2 id="form-titulo">Novo lançamento</h2>
      <form id="form-lancamento">
        <div class="form-grid">
          <div class="field">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" required />
          </div>
          <div class="field">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" min="0.01" required />
          </div>
          <div class="field">
            <label for="tipo">Tipo</label>
            <select id="tipo">
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
            </select>
          </div>
          <div class="field">
            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" placeholder="Ex.: Vendas, Aluguel" />
          </div>
          <div class="field">
            <label for="data">Data</label>
            <input type="date" id="data" required />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-salvar">Adicionar</button>
          <button type="button" class="secondary hidden" id="btn-cancelar">Cancelar edição</button>
        </div>
        <div id="msg" class="msg"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Lançamentos</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Tipo</th>
              <th style="text-align: right">Valor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
